{% extends "base.html" %}{% block content %}<h1>Stored Notifications</h1><div class="card"><table><tr><th>Date</th><th>Person</th><th>Type</th><th>Message</th></tr>{% for n in notifications %}<tr><td>{{n.created_at}}</td><td>{{n.person.full_name}}</td><td>{{n.notification_type}}</td><td>{{n.message}}</td></tr>{% empty %}<tr><td colspan="4">No notifications.</td></tr>{% endfor %}</table></div>{% endblock %}
