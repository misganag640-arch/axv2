{% extends "base.html" %}{% block content %}<h1>Payments</h1><div class="card"><form method="get"><input name="q" value="{{q}}" placeholder="Search ID, name or reference"><select name="status"><option value="">All</option><option value="unpaid" {% if status == 'unpaid' %}selected{% endif %}>Unpaid</option><option value="overdue" {% if status == 'overdue' %}selected{% endif %}>Overdue</option><option value="paid" {% if status == 'paid' %}selected{% endif %}>Paid</option></select><button>Search</button></form></div><div class="card"><table><tr><th>Person</th><th>Amount</th><th>Due</th><th>Paid</th><th>Status</th></tr>{% for p in payments %}<tr><td><a href="{% url 'person_detail' p.person.pk %}">{{p.person.full_name}}</a></td><td>{{p.amount}}</td><td>{{p.due_date}}</td><td>{{p.payment_date|default:'-'}}</td><td>{{p.status}}</td></tr>{% empty %}<tr><td colspan="5">No records.</td></tr>{% endfor %}</table></div>{% endblock %}
